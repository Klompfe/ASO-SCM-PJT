services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: scm_user
      POSTGRES_PASSWORD: scm_password
      POSTGRES_DB: scm_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scm_user -d scm_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_TYPE: postgres
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: scm_user
      DB_PASSWORD: scm_password
      DB_DATABASE: scm_db
      DB_SSL: "false"
      NODE_ENV: production
      PORT: 3000
      JWT_SECRET: change_this_jwt_secret_in_production
      JWT_EXPIRES_IN: 1h
      CORS_ORIGIN: http://localhost:80,http://localhost:5173
      GEMINI_API_KEY: ""

  frontend:
    build:
      context: ./frontend-app
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:3000
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
